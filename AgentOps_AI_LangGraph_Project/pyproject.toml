[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentops-ai"
version = "0.2.0"
description = "Human-supervised Agentic AI incident response starter"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.25,<1",
  "pydantic>=2,<3",
  "httpx>=0.26,<1"
]

[project.optional-dependencies]
langgraph = ["langgraph>=1,<2", "langchain-core>=1,<2"]
dev = ["pytest>=8,<10"]

[tool.setuptools.package-data]
agentops = ["static/*.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
